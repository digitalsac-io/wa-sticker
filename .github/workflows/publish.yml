name: Workflow - Push em NPM

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  # Permite disparar manualmente pelo botão "Run workflow" na aba Actions
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      # Build explícito: o npm v12 desliga allowScripts por padrão, então o
      # hook `prepublish` deixa de rodar e o dist/ (gitignored) não seria gerado.
      - run: npm run build
      # Falha cedo e com mensagem clara se o secret não estiver configurado,
      # em vez do stack trace confuso da action de publish.
      - name: Verificar NPM_TOKEN
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN ausente. Crie em Settings > Secrets and variables > Actions > Repository secrets (aba Secrets, não Variables) deste repositório."
            exit 1
          fi
          echo "NPM_TOKEN presente"
      # v4.1.5: runtime Node 24, sem set-output deprecated
      - uses: JS-DevTools/npm-publish@v4.1.5
        with:
          token: ${{ secrets.NPM_TOKEN }}
